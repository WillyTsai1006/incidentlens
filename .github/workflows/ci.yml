name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  default-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INCIDENT_MODEL_PATH: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core, test and UI dependencies (no local-model extra)
        run: python -m pip install -e ".[dev,ui]"
      - name: Default tests (optional offline-model tests skip)
        run: python -m pytest -q
      - name: Deterministic mock controlled evaluation
        run: python -m evaluation.run_evaluation --backend mock --no-artifacts
